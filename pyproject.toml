[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavlens"
version = "0.1.0"
description = "Interactive waveform, spectrogram, pyannote annotation lanes and moving playhead for Jupyter"
keywords = ["pyannote", "diarization", "audio", "jupyter", "widget", "wavesurfer"]
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Michael Soloveitchik" }]
requires-python = ">=3.10"
dependencies = [
    "anywidget>=0.9",
    "ipywidgets>=8.0",
    "traitlets>=5.0",
    "numpy>=1.22",
    "soundfile>=0.12",
    "pyannote.core>=5.0",
    "matplotlib>=3.5",
    "Pillow>=9.0",
    "scipy>=1.8",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: Jupyter",
]

[project.optional-dependencies]
dev = ["build", "twine", "playwright", "jupyter", "nbconvert", "nbformat", "pyannote.database", "torch"]
# kept for backward compatibility: these are now part of the core dependencies
spectrogram = ["matplotlib>=3.5", "Pillow>=9.0"]
cubic = ["scipy>=1.8"]
all = ["matplotlib>=3.5", "Pillow>=9.0", "scipy>=1.8"]

[project.urls]
Homepage = "https://github.com/michaelsoloveitchik/wavlens"

[tool.setuptools.packages.find]
include = ["wavlens*"]

[tool.setuptools.package-data]
wavlens = ["wavlens.js", "wavlens.iife.js"]
